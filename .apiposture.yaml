
rules:
  enabled: []          
  disabled: []         

include:
  - "**/*.py"

exclude:
  - "**/__pycache__/**"
  - "**/venv/**"
  - "**/.venv/**"
  - "**/site-packages/**"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/tests/**"
  - "**/conftest.py"

suppressions:
  
min_severity: info

ai_filter:
 
  preset: rules_review

 
  use_llm: true                  
  llm_model: qwen2.5-coder:7b     
  use_rules: true                
  min_rule_support: 2            
  auto_suppress_threshold: 70    
  code_context_lines: 10         
  protect_critical: true         